[package]
name = "rmesg"
version = "1.0.24"
authors = ["Archis Gore <me@archisgore.com>"]
edition = "2018"
license = "Apache-2.0"
categories = ["os", "command-line-utilities"]
keywords = ["dmesg", "klogctl", "printk", "syslog"]
readme = "README.md"
repository = "https://github.com/archisgore/rmesg"
description = """This is a fully Rust-based implementation of the popular dmesg Linux utility, giving
 programmatic access to the kernel log buffer."""

[[bin]]
name = "rmesg"
path = "src/main.rs"
required-features = ["async"]

[lib]
name = "rmesg"
path = "src/lib.rs"

[features]
default = ["async"]
# The default set of optional packages. Most people will want to use these
# packages, but they are strictly optional. Note that `session` is not a package
# but rather another feature listed in this manifest.
sync = []
async = ["clap", "futures", "futures-util", "tokio", "pin-project"]
extra-traits = ["serde"]

[dependencies]
libc = "0.2.191"
cfg-if = "1.0.5"
errno = "0.3.14"
lazy_static = "1.5.1"
regex = "1.13.1"
# held at 0.27: 0.28 changes the public FromStr::Err type (strum::ParseError) of LogLevel/LogFacility — semver-major
strum = "0.27"
strum_macros = "0.27"
num-traits = "0.2.19"
num-derive = "0.5.1"
nonblock = "0.2.0"

# Optional - on extra-traits
serde = { version = "1.0.229", features = ["derive"], optional = true }

# Optional - only enabled through the "async" feature
clap = { version = "4.6.7", optional = true }
futures = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", optional = true }
tokio = { version = "1.54.1", features = ["rt", "fs", "io-util", "macros", "time"], optional = true }
pin-project = {version = "1.1.13", optional = true }

[dev-dependencies]
tokio-stream = { version = "0.1.19" }
rand = "0.10.3"
criterion = { version = "0.8.2", features = ["async_tokio"]}

[profile.dev]
# We don't need stack unwinding in dev either - can be manually enabled
panic = 'abort'

[profile.release]
# We don't need stack unwinding in releases
panic = 'abort'
# Enable LTO for release (since it only builds in Travis and doesn't block day to day)
lto = "fat"
# One code-gen unit so we get a highly optimized binary
codegen-units = 1

[package.metadata.cargo-all-features]
skip_optional_dependencies = true

[[bench]]
name = "benchmark"
harness = false
required-features = ["sync", "async"]
